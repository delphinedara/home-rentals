name: Playwright QA Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24 for Angular 20
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate rental property data
        run: python3 scripts/validate_homes.py

      - name: Install Angular dependencies
        run: npm ci

      - name: Run TypeScript lint checks
        run: npm run lint

      - name: Build Angular application
        run: npm run build -- --configuration production

      - name: Run Angular unit tests with coverage
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "ERROR: No Chrome or Chromium executable found"
            exit 1
          fi
          echo "Using browser: $CHROME_BIN"
          export CHROME_BIN
          npm test -- \
            --watch=false \
            --browsers=ChromeHeadless \
            --code-coverage

      - name: Set up Node 24 for Playwright
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Playwright dependencies
        working-directory: qa
        run: npm ci

      - name: Install Chromium
        working-directory: qa
        run: npx playwright install --with-deps chromium

      - name: Start Express server
        run: |
          node server.js &
          echo $! > server.pid

      - name: Wait for application
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/homes > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Run Playwright tests
        working-directory: qa
        run: npm test -- --workers=1

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: qa/playwright-report/
          retention-days: 7
